name: AI review

# Enforced across the organization by a repository ruleset. The reviewer reads
# PR diffs through GitHub's API; it does not check out or run PR code.
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # GitHub requires a job conditional for a ruleset workflow to run on PRs
    # outside this source repository. Dependabot PRs have no usable API secret.
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: dragonleech-code/ai-review/.github/workflows/ai-review.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number || '0' }}
      context_file: ${{ (github.repository == 'dragonleech-code/cvis' || github.repository == 'dragonleech-code/concordvanguard.com') && '.github/review-conventions.md' || 'CLAUDE.md' }}
    secrets: inherit
